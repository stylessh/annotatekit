name: Release

# Manual only. Nothing is published unless someone runs this workflow with
# "dry_run" unchecked and an NPM_TOKEN repository secret exists. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, check and pack, but don't version or publish"
        type: boolean
        default: true

concurrency: release

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version packages" pull request
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:packages

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          pnpm changeset status --verbose
          pnpm -r publish --dry-run --no-git-checks

      - name: Require an npm token
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret (an npm automation token) before releasing."
            exit 1
          fi

      # With pending changesets this opens (or updates) a "Version packages" pull
      # request. Once that is merged and there are none left, running again
      # publishes the new versions to npm and pushes the git tags.
      - name: Version or publish
        if: ${{ !inputs.dry_run }}
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
